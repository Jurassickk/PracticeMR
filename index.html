<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Document</title>
</head>
<body>
    <div class="calculator">
    <h2>Calculadora</h2>
    <input type="number" id="num1" placeholder="Número 1">
    <input type="number" id="num2" placeholder="Número 2">
    
    <button onclick="calculate('+')">Sumar (+)</button>
    <button onclick="calculate('-')">Restar (-)</button>
    <button onclick="calculate('*')">Multiplicar (×)</button>
    <button onclick="calculate('/')">Dividir (÷)</button>

    <div class="history" id="history"></div>
    <button class="clear-history" onclick="clearHistory()">Borrar Historial</button>
</div>
<script src="js/logic.js"></script>
</body>
</html>
